schema: arc/v1
name: pulse
type: tool
tier: community
version: 0.31.0
description: Process execution engine — tree runner, action system with capability injection, pipeline pipe model, flow orchestration
author:
  name: Jens-Christian Fischer
  github: jcfischer
license: MIT

depends_on:
  tools:
    - bun

provides:
  cli:
    - name: pulse
      command: bun src/cli.ts
      description: Pulse CLI — validate and run process trees
  library:
    - name: pulse
      entry: src/index.ts
      description: PulseRunner, runAction, runPipeline, runFlow — importable execution engine

scripts:
  postinstall: bun install

capabilities:
  filesystem:
    read:
      - "~/.config/arc/pkg/repos"   # arc package discovery (src/lib/arc.ts)
    write:
      - "~/.local/state/pulse"      # run-ledger outbox spool, honours XDG_STATE_HOME (src/lib/run-ledger.ts)
  network:
    - host: "*.workers.dev"
      reason: Dispatch actions to Cloudflare Workers in cloud mode
    - host: "localhost"
      reason: NATS bus for run-ledger events and agent dispatch, default localhost:4222 (src/lib/run-ledger.ts, src/lib/agent-provider.ts)
