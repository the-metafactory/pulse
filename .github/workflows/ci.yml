name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mirrors pilot's CI (pilot .github/workflows/ci.yml, itself after cortex):
# one named job per check, oven-sh/setup-bun, and a frozen install against
# bun.lock. The job names (Typecheck, Test) are what `statusCheckRollup`
# reports; keep them stable. They block a merge only once branch protection
# on main lists them as required status checks — a repo setting, not this file.
#
# Bun is pinned so a result changes only with a commit; bump BUN_VERSION on
# purpose. No lint job: pulse has no ESLint setup yet. No private-dependency
# auth step: every dependency is public on npm.
#
# The suite needs no credentials, running services or tools beyond sh, echo
# and sleep: models, agent providers, gateways and chat surfaces are local
# mock servers or injected fakes. The live Mermaid render test skips without
# a renderer.
#
# Actions are pinned to commit SHAs (tag in the trailing comment); bump both
# together.

permissions:
  contents: read

# A PR's runs share one group (keyed by PR number, so same-named fork
# branches don't collide), and a new push cancels the superseded run. A push
# to main gets a group of its own (run_id), so it is never cancelled or
# replaced while queued: every main commit keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.6

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after checkout needs git credentials; keep the token out of
          # .git/config while PR code runs.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: tsc --noEmit
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after checkout needs git credentials; keep the token out of
          # .git/config while PR code runs.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: bun test
        run: bun test
